name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Check plugin version sync
        run: node scripts/sync-plugin-version.mjs --check
      - name: Test argos-index
        run: node --test "tests/*.test.mjs"
      - name: Discoverable by skills CLI
        run: npx --yes skills add . --list
